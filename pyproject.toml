[project]
name = "lightweight-data-platform"
version = "0.1.0"
description = "Contract-driven data quality: contracts derive the tests, results become a time series, no Elasticsearch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gkhnelbstn" }]
keywords = ["data-contracts", "data-quality", "data-catalog", "dbt", "great-expectations", "postgres"]

dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "api", "integrations", "integrations.odd"]

[project.optional-dependencies]
odd = ["odd-models>=2.0", "oddrn-generator>=0.1"]
dev = ["pytest>=8.0", "odd-models>=2.0", "oddrn-generator>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"
