[project]
name = "lightweight-data-platform"
version = "0.1.0"
description = "Contract-driven data quality on OpenDataDiscovery: ODCS contracts, results as a time series, no Elasticsearch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gkhnelbstn" }]
keywords = ["data-contracts", "odcs", "data-quality", "data-catalog", "opendatadiscovery", "postgres", "sqlserver"]

dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  # core/runner.py shells out to `datacontract test`; it derives and executes
  # the checks, so it is a runtime dependency and not an optional extra.
  "datacontract-cli[postgres]>=1.1.3,<2",
  # core/sample.py parses the SQL a check ran and rewrites it into the rows it
  # counted. datacontract-cli already pulls sqlglot in -- it is its engine --
  # but we import it directly, so it is declared directly. A transitive
  # dependency that disappears takes the sample rows with it.
  "sqlglot>=25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "api", "integrations", "integrations.odd"]

[project.optional-dependencies]
# Pushing to ODD. Both are small and neither has been released since 2024, so
# they are pinned rather than floated -- see docs/stack-choices.md.
odd = ["odd-models>=2.0,<3", "oddrn-generator>=0.1,<1"]
# Checking a SQL Server source additionally needs Microsoft's ODBC driver on
# the machine; the Dockerfile installs it.
sqlserver = ["datacontract-cli[sqlserver]>=1.1.3,<2"]
# Column classification. Needs `python -m spacy download en_core_web_sm` too;
# the Dockerfile does it, see integrations/odd/classify.py for why the small
# model is the right one.
classify = ["presidio-analyzer>=2.2"]
dev = [
  "pytest>=8.0",
  "odd-models>=2.0,<3",
  "oddrn-generator>=0.1,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"
