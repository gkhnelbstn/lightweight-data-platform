# The order lines behind sales_orders. Its own contract rather than a second
# model in erp_postgres.odcs.yaml: the runner, the sampler and the catalogue
# all address `schema[0]`, so one contract is one table here.
apiVersion: v3.0.2
kind: DataContract
id: erp.order_lines
name: Sales Order Lines
version: 1.0.0
status: active
domain: sales
tenant: sales-ops
description:
  purpose: >
    The line items of every sales order. The header's net_amount is checked
    against the sum of these, so a line that is wrong shows up as an accuracy
    failure on sales_orders rather than here.

servers:
  - server: erp
    type: postgres
    host: db
    port: 5432
    database: erp
    schema: public
  - server: erp_daily
    type: postgres
    host: db
    port: 5432
    database: erp
    schema: asof

slaProperties:
  - property: frequency
    value: 1
    unit: d

schema:
  - name: sales_order_lines
    physicalName: sales_order_lines
    logicalType: object
    physicalType: table
    description: One row per line on an order.
    properties:
      - name: order_id
        logicalType: integer
        physicalType: bigint
        description: "The order this line belongs to. Half of the key, and the join back to sales_orders."
        required: true
        primaryKey: true
      - name: line_no
        logicalType: integer
        physicalType: integer
        description: "Position of the line within its order. Unique per order, not globally."
        required: true
        primaryKey: true
      - name: sku
        logicalType: string
        physicalType: text
        description: "Stock keeping unit of the product on this line."
        required: true
      - name: qty
        logicalType: integer
        physicalType: integer
        description: "How many units. A line with none is a data error, not a cancellation."
        required: true
      - name: line_amount
        logicalType: number
        physicalType: numeric
        description: "Value of the line. The header's net_amount must equal the sum of these."
        required: true
      - name: loaded_at
        logicalType: date
        physicalType: date
        description: "The date this row arrived in the warehouse. The watermark the daily window is built on -- see ADR 0002."
        required: true

    quality:
      - type: sql
        description: every line must belong to an order that exists
        query: >
          select count(*) from sales_order_lines l
          left join sales_orders o on o.order_id = l.order_id
          where o.order_id is null
        mustBe: 0
        dimension: consistency

      - type: sql
        description: quantity must be positive
        query: select count(*) from sales_order_lines where qty <= 0
        mustBe: 0
        dimension: accuracy

      - type: sql
        description: line_amount must not be negative
        query: select count(*) from sales_order_lines where line_amount < 0
        mustBe: 0
        dimension: accuracy

      - type: sql
        description: an order must not have two lines with the same number
        query: >
          select count(*) from (
            select order_id, line_no from sales_order_lines
            group by order_id, line_no having count(*) > 1
          ) d
        mustBe: 0
        dimension: uniqueness
