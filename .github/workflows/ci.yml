name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests + contract lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject claims >=3.10, so both ends of that claim are tested.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

      # The contracts are the source of truth; a broken one is a broken build.
      # `lint` validates against the ODCS JSON Schema without touching a
      # database, which is the half that belongs in CI.
      - name: lint every contract against ODCS
        run: |
          for f in contracts/*.odcs.yaml; do
            echo "::group::$f"
            datacontract lint "$f"
            echo "::endgroup::"
          done

  integration:
    name: run the contracts against a real postgres
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ERP_DSN: postgresql://postgres:postgres@localhost:5432/erp
      DQ_DSN: postgresql://postgres:postgres@localhost:5432/dq
      DATACONTRACT_POSTGRES_USERNAME: postgres
      DATACONTRACT_POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: create the databases
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" \
            -c "create database erp" -c "create database dq"

      - run: python seed/seed.py

      # The contracts point at `db` inside compose; in CI the service is
      # reachable on localhost.
      - name: point the contracts at the CI host
        run: |
          sed -i 's/^    host: db$/    host: localhost/' contracts/*.odcs.yaml

      - name: two days, so the time series has more than one point
        run: python core/runner.py --backfill-days 1

      - name: assert the run actually stored something
        run: |
          python - <<'PY'
          from core import store
          with store.connect() as cx:
              days, rows = cx.execute(
                  "select count(distinct run_at), count(*) from check_results"
              ).fetchone()
              scored = cx.execute(
                  "select count(*) from contract_scores").fetchone()[0]
          print(f"{days} days, {rows} check results, {scored} scores")
          assert days == 2, f"expected 2 run dates, got {days}"
          assert rows > 40, f"suspiciously few results: {rows}"
          assert scored >= 2, f"expected a score per contract per day, got {scored}"
          PY

      - name: a result has to be readable on its own
        run: |
          python - <<'PY'
          from core import store
          # `name` is the rule in words and `sql` is what ran; the UI shows
          # both, and core/sample.py rewrites the second into the failing rows.
          # A check that *errored* never got as far as a statement, and that is
          # an engineering failure rather than a measurement -- it is reported
          # here but does not fail the build.
          with store.connect() as cx:
              blank = cx.execute(
                  "select check_id from check_results where name = ''"
              ).fetchall()
              nosql = cx.execute(
                  """select check_id, check_type, status from check_results
                     where sql is null""").fetchall()
          for row in nosql:
              print("no statement:", row)
          assert not blank, f"{len(blank)} results with no name: {blank[:5]}"
          ran = [r for r in nosql if r[2] != "error"]
          assert not ran, f"{len(ran)} completed checks with no statement: {ran[:5]}"
          print("every completed result carries its name and its statement")
          PY

      - name: re-running a day replaces it
        run: |
          python - <<'PY'
          import subprocess, sys
          from datetime import date
          from core import store
          # A check that existed in an earlier run and does not exist now. An
          # upsert leaves it behind for ever, and it keeps showing as an open
          # failure -- which is exactly how the real one was found.
          with store.connect() as cx:
              cx.execute(
                  """insert into check_results (run_at,check_id,contract_id,
                       dimension,status,failed_rows,total_rows,fail_ratio,
                       duration_ms,run_window,name,check_type)
                     values (%s,'ghost','erp.sales_orders','unknown','fail',
                             1,1,1,0,'incremental','ghost','sql')""",
                  (date.today(),))
          subprocess.run([sys.executable, "core/runner.py"], check=True)
          with store.connect() as cx:
              left = cx.execute(
                  "select count(*) from check_results where check_id = 'ghost'"
              ).fetchone()[0]
          assert left == 0, "a vanished check survived a re-run"
          print("the day is replaced, not merged")
          PY

  images:
    name: build the images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The collector image carries our fixes to its Superset adapter; if the
      # upstream file moves, the patch script fails the build rather than
      # silently producing a collector without them.
      - name: odd-collector (patched)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.odd-collector
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
