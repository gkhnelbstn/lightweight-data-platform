name: release

# Called by release-please.yml once it has tagged a release; a tag pushed by
# hand still starts it too, and so does a manual run for an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release
        required: true
  workflow_call:
    inputs:
      tag:
        description: tag to release
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: publish images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # From a call or a manual run the ref is main, not the tag: the input
      # wins whenever there is one.
      - id: meta
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/app:latest

      # Published because it is not stock: it carries the fixes to
      # odd-collector's Superset adapter reported as
      # opendatadiscovery/odd-collectors#135. When those land upstream this
      # image should go away rather than be maintained.
      - name: odd-collector (patched)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.odd-collector
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/odd-collector:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/odd-collector:latest

      # ODD Platform with the contract panel on its Data Quality page. Only its
      # UI jar differs from upstream -- see deploy/Dockerfile.odd-platform --
      # but that makes it a fork, so it is published rather than rebuilt on
      # every machine: the build clones upstream, generates their API client
      # and runs vite, which is minutes, not seconds.
      - name: odd-platform (contract panel)
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile.odd-platform
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/odd-platform:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/odd-platform:latest

  release:
    name: create the release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The contracts are the artifact a consumer most likely wants without
      # cloning: they are the source of truth and they are portable.
      - name: bundle the contracts
        run: |
          mkdir -p dist
          tar -czf dist/contracts-${{ inputs.tag || github.ref_name }}.tar.gz contracts/

      # release-please has already written the release and its notes from the
      # CHANGELOG; a tag pushed by hand has none yet, so one is made.
      - name: attach the contracts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/*.tar.gz --clobber
