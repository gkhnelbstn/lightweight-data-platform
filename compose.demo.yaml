# The sources the demo needs, and nothing the product needs.
#
# Kept out of compose.yaml so that what this project *is* -- ODD, a collector,
# a Postgres for the contracts and their results, and the app -- is not read
# as requiring a SQL Server and a BI tool. Bring them up together:
#
#   docker compose -f compose.yaml -f compose.demo.yaml --profile demo up -d
#
# or use the shorthand the README documents:
#
#   COMPOSE_FILE=compose.yaml:compose.demo.yaml docker compose up -d
#
# The demo databases these feed -- `erp_replica` for the sync rules and `dwh`
# for the medallion chain -- are created by the scripts that use them rather
# than by deploy/db-init.sql, for the same reason.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
      MSSQL_PID: Developer
      # CDC is a SQL Server Agent feature: `sp_cdc_enable_table` succeeds
      # without the Agent and then nothing ever populates the change table.
      # The image ships the Agent stopped.
      MSSQL_AGENT_ENABLED: "true"
      # SQL Server takes what it is given; on a laptop that is the whole box.
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - mssql-data:/var/opt/mssql
      # The seed and the CDC script are run with sqlcmd *inside* this
      # container, so they have to be reachable from in here.
      - ./demo:/demo:ro
      - ./deploy:/deploy:ro
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'select 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The CDC reader, which until now was a command in CLAUDE.md that somebody
  # had to remember. Issue #25.
  #
  # Postgres does not have this problem: its half is the database's own
  # subscription and it runs whether anyone is watching. SQL Server's half is
  # a poll, and a poll nobody started looks exactly like a poll with nothing
  # to do -- `last_synced` simply goes stale while every rule still reports
  # itself configured.
  #
  # It lives here rather than in compose.yaml because it reads `mssql`, which
  # lives here. `extends` rather than a second copy of the app service: the
  # environment is long, it is the same environment, and two of anything is
  # two to maintain. `ports: []` drops the API port the app publishes -- this
  # is the same image running a different command, not a second API -- and
  # `!reset` rather than `[]`, because an empty list *merges* with what was
  # extended and leaves the port there, which fails the whole service with
  # "Bind for 0.0.0.0:8077 failed: port is already allocated".
  # The Integration tab in ODD reads the demo's hub and flows (#78); a
  # deployment keeps them in contracts/, the default.
  app:
    environment:
      INTEGRATION_DIR: demo/integration
    # SeaTunnel's checkpoints, read to decide whether a flow can resume where
    # it stopped (core/flow_resume.py, ADR 0023). Read-only: they are its.
    volumes:
      - seatunnel-checkpoints:/seatunnel/checkpoints:ro

  sync-mssql:
    extends:
      file: compose.yaml
      service: app
    depends_on:
      db: { condition: service_healthy }
      mssql: { condition: service_healthy }
    command: ["python", "core/sync_mssql.py", "--interval", "30"]
    ports: !reset []
    profiles: ["demo"]

  # The runtime of the integration flows (ADR 0020, 0021): one SeaTunnel
  # cluster, the jobs submitted by `core/flow_jobs.py --apply`. Its own web UI
  # is on 8081 (ODD has 8080). Opt-in, because an idle cluster is ~450 MiB:
  #   docker compose -f compose.yaml -f compose.demo.yaml --profile demo --profile flows up -d
  seatunnel:
    build:
      context: deploy
      dockerfile: Dockerfile.seatunnel
    image: lightweight-data-platform/seatunnel:2.3.13
    command: ["./bin/seatunnel-cluster.sh"]
    depends_on:
      db: { condition: service_healthy }
      mssql: { condition: service_healthy }
    ports: ["8081:8080"]
    # A restart loses every job (measured); the checkpoints are what a flow
    # resumes from, so they outlive the container.
    volumes:
      - seatunnel-checkpoints:/tmp/seatunnel/checkpoint_snapshot
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    profiles: ["flows"]

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    volumes: ["mongo-data:/data/db"]
    ports: ["27017:27017"]
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    healthcheck:
      # `db.adminCommand(1)` is not valid in mongosh -- it wants a string or an
      # object -- so this reported unhealthy for ever while Mongo was fine and
      # the collector was reading it happily.
      test: ["CMD-SHELL", "mongosh --quiet -u root -p rootpass --authenticationDatabase admin --eval \"db.adminCommand({ping: 1})\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  superset:
    image: apache/superset:latest
    depends_on:
      mssql: { condition: service_healthy }
    environment:
      SUPERSET_SECRET_KEY: "demo-not-a-secret-change-me"
      SUPERSET_LOAD_EXAMPLES: "no"
      FLASK_APP: superset
      # bootstrap.sh pip-installs the SQL Server driver as the superset user,
      # which lands in ~/.local and is not on gunicorn's path by default.
      PYTHONPATH: /app/superset_home/.local/lib/python3.10/site-packages
    volumes:
      - superset-home:/app/superset_home
      - ./demo/superset-bootstrap.sh:/app/bootstrap.sh:ro
    ports: ["8089:8088"]
    entrypoint: ["/bin/bash", "/app/bootstrap.sh"]

volumes:
  seatunnel-checkpoints:
  mssql-data:
  mongo-data:
  superset-home:
