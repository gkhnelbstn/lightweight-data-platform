id: crm_to_hub
from: crm.account
to: hub.customer
columns: {crm_code: ACCOUNT_CODE, name: TITLE, tax_id: TAX_NO, active: ACTIVE}
values:
  active: {Y: true, N: false}
# A CRM account the hub has not seen is the customer with its tax number.
linkBy: [tax_id]
# What SeaTunnel is told about running it (#109). Five seconds here rather
# than the default three, to show the setting; nothing in the demo needs it.
job: {checkpointInterval: 5000}
