# The golden customer record both systems meet in (ADR 0021). The CRM's
# values stand when both already hold the same customer at the first sync.
# The two systems number their customers differently (#80): the record's key
# is the hub's own, and each system's code is a column of it.
apiVersion: v3.0.2
kind: DataContract
id: hub.customer
name: Customer (hub)
version: 1.0.0
status: active
servers:
  - server: hub
    type: postgres
    host: db
    port: 5432
    database: hub
    schema: hub
schema:
  - name: customer
    physicalName: customer
    physicalType: table
    properties:
      - {name: customer_id, physicalType: bigint, primaryKey: true, required: true, description: "The hub's own number for the customer, neither system's."}
      - {name: crm_code, physicalType: int, description: "The CRM's account code for this customer."}
      - {name: billing_code, physicalType: text, description: "Billing's customer code for this customer."}
      - {name: shop_code, physicalType: bigint, description: "The shop's customer number for this customer."}
      - {name: name, physicalType: text, required: true, description: "Name, whichever system set it last."}
      - {name: tax_id, physicalType: text, classification: pii, description: "Tax identifier."}
      - {name: active, physicalType: boolean, required: true, description: "Whether the customer is active."}
      - {name: invoice_city, physicalType: text, description: "Invoice address city: a column in billing, a row in the CRM."}
      - {name: shipping_city, physicalType: text, description: "Shipping address city: a column in billing, a row in the CRM."}
customProperties:
  - property: hub
    value:
      authority: crm.account
      keys: {crm: crm_code, billing: billing_code, shop: shop_code}
